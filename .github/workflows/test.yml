name: Test

on: [push, pull_request]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v6
        with:
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: extractions/setup-just@v3
      - name: Install frontend deps
        run: npm install --prefix frontend
      - name: Build frontend bundle
        run: just frontend
      # datasette-acl-share is an editable path dependency (../datasette-acl-share)
      # that isn't published yet, so CI must provide the sibling checkout. Its
      # built bundle is gitignored, so build it too — paper's doc page reads its
      # manifest via datasette_share_assets (exercised by the backend suite).
      - name: Check out + build datasette-acl-share sibling
        run: |
          git clone --depth 1 --branch asg017/sharing-v2 \
            https://github.com/datasette/datasette-acl-share.git ../datasette-acl-share
          npm --prefix ../datasette-acl-share/frontend install
          npm --prefix ../datasette-acl-share/frontend run build
      - name: Format check
        run: just format-backend-check
      - name: Lint
        run: just check-backend
      - name: Backend tests
        run: just test

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
      - uses: extractions/setup-just@v3
      - name: Install frontend deps
        run: npm install --prefix frontend
      - name: Type-check
        run: just check-frontend
      - name: Lint
        run: just lint-frontend
      - name: Frontend tests
        run: just test-frontend

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v6
      - uses: extractions/setup-just@v3
      - name: Install frontend deps
        run: npm install --prefix frontend
      - name: Build frontend bundle
        run: just frontend
      # See the backend job: provide + build the unpublished datasette-acl-share
      # sibling so its <datasette-acl-share-dialog> bundle is served in e2e.
      - name: Check out + build datasette-acl-share sibling
        run: |
          git clone --depth 1 --branch asg017/sharing-v2 \
            https://github.com/datasette/datasette-acl-share.git ../datasette-acl-share
          npm --prefix ../datasette-acl-share/frontend install
          npm --prefix ../datasette-acl-share/frontend run build
      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: E2E tests
        run: just test-e2e
